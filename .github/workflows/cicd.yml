#github repo Actions 이름
name: CI/CD

on:
  workflow_dispatch: # 수동 실행 트리거
  # push:
  #   branches: ["develop"]
  # pull_request:
  #   branches: ["develop"]
  
permissions: write-all

jobs:
  build-and-deploy:
  # ubuntu 최신버전에서 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}
          submodules: true
          # 자바 버전설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Add permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build -x test
         
      - name: Docker build & push to docker repo
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }}/directors-dev .
          docker push ${{ secrets.DOCKER_REPO }}/directors-dev

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        id: deploy
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PEMKEY }}
          envs: GITHUB_SHA
          script: |
            sudo docker stop spring-server-container
            sudo docker rm spring-server-container
            sudo docker pull ${{ secrets.EC2_DOCKER_REPO }}/directors-dev
            sudo docker run --name spring-server-container -d -p 8081:8081 \
              -e STEAM_API_KEY=${{ secrets.STEAM_API_KEY }} \
              -e STEAM_APP_ID=${{ secrets.STEAM_APP_ID }} \
              ${{ secrets.DOCKER_REPO }}/directors-dev
            sudo docker image prune -f
